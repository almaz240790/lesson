<text x="14.0" y="29.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">Тильт замыкается в круг, пока чек-лист и лимиты не разорвут его</text>
<text x="14.0" y="50.0" font-size="12" text-anchor="start" fill="#6b7280">Чек-лист не пропускает сделку вне плана, лимиты не дают убытку запустить следующий круг</text>
<text x="170.0" y="120.0" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="700">Убыток</text>
<text x="170.0" y="140.0" font-size="11.5" text-anchor="middle" fill="#6b7280">стоп по плану, −1R</text>
<text x="590.0" y="120.0" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="700">Желание вернуть</text>
<text x="590.0" y="140.0" font-size="11.5" text-anchor="middle" fill="#6b7280">«сейчас точно отобью»</text>
<text x="590.0" y="310.0" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="700">Сделка вне плана</text>
<text x="590.0" y="330.0" font-size="11.5" text-anchor="middle" fill="#6b7280">размер больше, без чек-листа</text>
<text x="170.0" y="310.0" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="700">Убыток больше прежнего</text>
<text x="170.0" y="330.0" font-size="11.5" text-anchor="middle" fill="#6b7280">−2R, затем −4R</text>
<text x="606.0" y="218.0" font-size="12.5" text-anchor="start" fill="#15803d" font-weight="700">Стоп-кран 1: чек-лист</text>
<text x="606.0" y="235.0" font-size="11.5" text-anchor="start" fill="#6b7280">нет галочек — нет сделки</text>
<text x="186.0" y="218.0" font-size="12.5" text-anchor="start" fill="#15803d" font-weight="700">Стоп-кран 2: лимиты</text>
<text x="186.0" y="235.0" font-size="11.5" text-anchor="start" fill="#6b7280">2 убытка подряд, −3% день, −6% неделя</text>
<text x="380.0" y="117.0" font-size="12" text-anchor="middle" fill="#6b7280">отыгрыш</text>
<text x="380.0" y="307.0" font-size="12" text-anchor="middle" fill="#6b7280">круг повторяется</text>
<text x="14.0" y="386.0" font-size="12" text-anchor="start" fill="#6b7280">Без кранов день заканчивается −7R вместо −2R: лишние 5R равны 18 сделкам по плану при ожидании +0,28R.</text>
</svg>
