<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" role="img" aria-label="Тип свечи определяют тело, тени и положение закрытия">
<rect width="760" height="400" fill="#ffffff"/>
<line x1="105.0" y1="90.0" x2="105.0" y2="270.0" stroke="#26a69a" stroke-width="2"/>
<rect x="85.0" y="112.0" width="40.0" height="132.0" fill="#26a69a" stroke="none"/>
<line x1="275.0" y1="90.0" x2="275.0" y2="270.0" stroke="#26a69a" stroke-width="2"/>
<rect x="255.0" y="100.0" width="40.0" height="20.0" fill="#26a69a" stroke="none"/>
<line x1="445.0" y1="90.0" x2="445.0" y2="270.0" stroke="#ef5350" stroke-width="2"/>
<rect x="425.0" y="240.0" width="40.0" height="18.0" fill="#ef5350" stroke="none"/>
<line x1="615.0" y1="90.0" x2="615.0" y2="270.0" stroke="#26a69a" stroke-width="2"/>
<rect x="595.0" y="178.0" width="40.0" height="5.0" fill="#26a69a" stroke="none"/>
<line x1="129.0" y1="112.0" x2="151.0" y2="112.0" stroke="#2563eb" stroke-width="1.25"/>
<line x1="299.0" y1="100.0" x2="321.0" y2="100.0" stroke="#2563eb" stroke-width="1.25"/>
<line x1="469.0" y1="258.0" x2="491.0" y2="258.0" stroke="#2563eb" stroke-width="1.25"/>
<line x1="639.0" y1="178.0" x2="661.0" y2="178.0" stroke="#2563eb" stroke-width="1.25"/>
<text x="14.0" y="29.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">Тип свечи определяют тело, тени и положение закрытия</text>
<text x="14.0" y="50.0" font-size="12" text-anchor="start" fill="#6b7280">Положение закрытия = (Close − Low) / (High − Low)</text>
<text x="105.0" y="300.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">Длинное тело</text>
<text x="105.0" y="322.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="600">закрытие на 88%</text>
<text x="105.0" y="345.0" font-size="12" text-anchor="middle" fill="#6b7280">Одна сторона вела цену</text>
<text x="105.0" y="361.0" font-size="12" text-anchor="middle" fill="#6b7280">весь период</text>
<circle cx="151.0" cy="112.0" r="3" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<text x="275.0" y="300.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">Длинная нижняя тень</text>
<text x="275.0" y="322.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="600">закрытие на 94%</text>
<text x="275.0" y="345.0" font-size="12" text-anchor="middle" fill="#6b7280">Падение выкуплено</text>
<text x="275.0" y="361.0" font-size="12" text-anchor="middle" fill="#6b7280">покупателями</text>
<circle cx="321.0" cy="100.0" r="3" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<text x="445.0" y="300.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">Длинная верхняя тень</text>
<text x="445.0" y="322.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="600">закрытие на 7%</text>
<text x="445.0" y="345.0" font-size="12" text-anchor="middle" fill="#6b7280">Рост возвращён</text>
<text x="445.0" y="361.0" font-size="12" text-anchor="middle" fill="#6b7280">продавцами</text>
<circle cx="491.0" cy="258.0" r="3" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<text x="615.0" y="300.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">Доджи</text>
<text x="615.0" y="322.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="600">закрытие на 51%</text>
<text x="615.0" y="345.0" font-size="12" text-anchor="middle" fill="#6b7280">Ни одна сторона</text>
<text x="615.0" y="361.0" font-size="12" text-anchor="middle" fill="#6b7280">не победила</text>
<circle cx="661.0" cy="178.0" r="3" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<text x="14.0" y="385.0" font-size="11" text-anchor="start" fill="#6b7280">Тонкая линия справа от свечи — цена закрытия.</text>
</svg>
