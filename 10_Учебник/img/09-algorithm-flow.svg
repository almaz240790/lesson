<text x="14.0" y="29.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">Десять шагов: ответ «нет» на семи из них заканчивается записью «ждать»</text>
<text x="14.0" y="50.0" font-size="12" text-anchor="start" fill="#6b7280">Шаги идут сверху вниз; сделка открывается только после шага 10</text>
<text x="26.0" y="91.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">1. Календарь</text>
<text x="204.0" y="91.0" font-size="13.5" text-anchor="start" fill="#1f2937">Вне окна ±30 минут от новости?</text>
<text x="542.0" y="91.0" font-size="12.5" text-anchor="end" fill="#6b7280" font-weight="600">новости</text>
<text x="592.0" y="80.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">нет</text>
<text x="26.0" y="139.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">2. Тренд</text>
<text x="204.0" y="139.0" font-size="13.5" text-anchor="start" fill="#1f2937">Есть ли тренд вверх или вниз?</text>
<text x="542.0" y="139.0" font-size="12.5" text-anchor="end" fill="#2563eb" font-weight="600">1D</text>
<text x="592.0" y="128.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">нет</text>
<text x="26.0" y="187.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">3. Зоны</text>
<text x="204.0" y="187.0" font-size="13.5" text-anchor="start" fill="#1f2937">Где поддержка и сопротивление?</text>
<text x="542.0" y="187.0" font-size="12.5" text-anchor="end" fill="#2563eb" font-weight="600">1D, 1W</text>
<text x="26.0" y="235.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">4. Место цены</text>
<text x="204.0" y="235.0" font-size="13.5" text-anchor="start" fill="#1f2937">Цена у зоны по тренду?</text>
<text x="542.0" y="235.0" font-size="12.5" text-anchor="end" fill="#2563eb" font-weight="600">1D</text>
<text x="592.0" y="224.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">нет</text>
<text x="26.0" y="283.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">5. Сетап</text>
<text x="204.0" y="283.0" font-size="13.5" text-anchor="start" fill="#1f2937">Есть ли откат к зоне?</text>
<text x="542.0" y="283.0" font-size="12.5" text-anchor="end" fill="#15803d" font-weight="600">4H</text>
<text x="592.0" y="272.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">нет</text>
<text x="26.0" y="331.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">6. Триггер</text>
<text x="204.0" y="331.0" font-size="13.5" text-anchor="start" fill="#1f2937">Закрылась ли свеча подтверждения?</text>
<text x="542.0" y="331.0" font-size="12.5" text-anchor="end" fill="#15803d" font-weight="600">4H</text>
<text x="592.0" y="320.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">нет</text>
<text x="26.0" y="379.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">7. Вход, стоп, цель</text>
<text x="204.0" y="379.0" font-size="13.5" text-anchor="start" fill="#1f2937">R:R не меньше 1:2?</text>
<text x="542.0" y="379.0" font-size="12.5" text-anchor="end" fill="#15803d" font-weight="600">4H</text>
<text x="592.0" y="368.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">нет</text>
<text x="26.0" y="427.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">8. Размер позиции</text>
<text x="204.0" y="427.0" font-size="13.5" text-anchor="start" fill="#1f2937">Лимиты риска не нарушены?</text>
<text x="542.0" y="427.0" font-size="12.5" text-anchor="end" fill="#b45309" font-weight="600">расчёт</text>
<text x="592.0" y="416.0" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">нет</text>
<text x="26.0" y="475.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">9. Журнал</text>
<text x="204.0" y="475.0" font-size="13.5" text-anchor="start" fill="#1f2937">Идея записана, скриншоты сделаны?</text>
<text x="542.0" y="475.0" font-size="12.5" text-anchor="end" fill="#b45309" font-weight="600">запись</text>
<text x="26.0" y="523.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">10. Ордера</text>
<text x="204.0" y="523.0" font-size="13.5" text-anchor="start" fill="#1f2937">Стоп и цель стоят на бирже?</text>
<text x="542.0" y="523.0" font-size="12.5" text-anchor="end" fill="#b45309" font-weight="600">биржа</text>
<text x="688.0" y="246.0" font-size="20" text-anchor="middle" fill="#b45309" font-weight="700">Ждать</text>
<text x="688.0" y="268.0" font-size="12.5" text-anchor="middle" fill="#6b7280">и оповещение</text>
<text x="688.0" y="285.0" font-size="12.5" text-anchor="middle" fill="#6b7280">у зоны</text>
<text x="284.0" y="572.0" font-size="13.5" text-anchor="middle" fill="#15803d" font-weight="700">Сделка открыта: вход, стоп и тейк-профит на бирже</text>
</svg>
