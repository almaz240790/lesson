<text x="14.0" y="29.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">На следующий этап ведёт условие, а не дата</text>
<text x="14.0" y="50.0" font-size="12" text-anchor="start" fill="#6b7280">Шесть этапов за 12 месяцев при 30–60 минутах в день</text>
<text x="34.0" y="79.0" font-size="12" text-anchor="start" fill="#1f2937">учёба</text>
<text x="109.0" y="79.0" font-size="12" text-anchor="start" fill="#1f2937">100 сделок на демо</text>
<text x="269.8" y="79.0" font-size="12" text-anchor="start" fill="#1f2937">реальный счёт</text>
<text x="746.0" y="108.0" font-size="12" text-anchor="end" fill="#b45309">дольше, если сделок меньше 4 в неделю</text>
<text x="59.8" y="148.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="600">1</text>
<text x="119.3" y="148.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="600">2</text>
<text x="178.8" y="148.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="600">3</text>
<text x="232.7" y="148.0" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="600">4</text>
<text x="436.7" y="148.0" font-size="13" text-anchor="middle" fill="#b45309" font-weight="600">5</text>
<text x="663.3" y="148.0" font-size="13" text-anchor="middle" fill="#15803d" font-weight="600">6</text>
<text x="68.3" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">1</text>
<text x="125.0" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">2</text>
<text x="181.7" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">3</text>
<text x="238.3" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">4</text>
<text x="295.0" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">5</text>
<text x="351.7" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">6</text>
<text x="408.3" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">7</text>
<text x="465.0" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">8</text>
<text x="521.7" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">9</text>
<text x="578.3" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">10</text>
<text x="635.0" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">11</text>
<text x="691.7" y="195.0" font-size="12" text-anchor="middle" fill="#6b7280">12</text>
<text x="720.0" y="212.0" font-size="12" text-anchor="end" fill="#6b7280">месяц</text>
<text x="24.0" y="260.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="600">1. Фундамент</text>
<text x="24.0" y="279.0" font-size="12" text-anchor="start" fill="#6b7280">недели 1–3 · главы 1–3</text>
<text x="24.0" y="295.0" font-size="12" text-anchor="start" fill="#6b7280">ступень 01</text>
<text x="24.0" y="333.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="600">Условие:</text>
<text x="24.0" y="349.0" font-size="12" text-anchor="start" fill="#1f2937">тест ступени на 80%+;</text>
<text x="24.0" y="364.0" font-size="12" text-anchor="start" fill="#1f2937">практика выполнена</text>
<text x="282.0" y="260.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="600">2. Анализ графика</text>
<text x="282.0" y="279.0" font-size="12" text-anchor="start" fill="#6b7280">недели 4–9 · главы 4–9</text>
<text x="282.0" y="295.0" font-size="12" text-anchor="start" fill="#6b7280">ступень 02</text>
<text x="282.0" y="333.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="600">Условие:</text>
<text x="282.0" y="349.0" font-size="12" text-anchor="start" fill="#1f2937">тест на 80%+;</text>
<text x="282.0" y="364.0" font-size="12" text-anchor="start" fill="#1f2937">бланк анализа 10 дней подряд</text>
<text x="540.0" y="260.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="600">3. Вход и риск</text>
<text x="540.0" y="279.0" font-size="12" text-anchor="start" fill="#6b7280">недели 10–12 · главы 10–12</text>
<text x="540.0" y="295.0" font-size="12" text-anchor="start" fill="#6b7280">ступень 03</text>
<text x="540.0" y="333.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="600">Условие:</text>
<text x="540.0" y="349.0" font-size="12" text-anchor="start" fill="#1f2937">тест на 80%+;</text>
<text x="540.0" y="364.0" font-size="12" text-anchor="start" fill="#1f2937">20 расчётов позиции без</text>
<text x="540.0" y="379.0" font-size="12" text-anchor="start" fill="#1f2937">ошибки;</text>
<text x="540.0" y="394.0" font-size="12" text-anchor="start" fill="#1f2937">10 учебных сделок</text>
<text x="24.0" y="498.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="600">4. Система</text>
<text x="24.0" y="517.0" font-size="12" text-anchor="start" fill="#6b7280">недели 13–16 · главы 13–15</text>
<text x="24.0" y="533.0" font-size="12" text-anchor="start" fill="#6b7280">ступени 04–06</text>
<text x="24.0" y="571.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="600">Условие:</text>
<text x="24.0" y="587.0" font-size="12" text-anchor="start" fill="#1f2937">тест 04 на 80%+;</text>
<text x="24.0" y="602.0" font-size="12" text-anchor="start" fill="#1f2937">практика 05;</text>
<text x="24.0" y="617.0" font-size="12" text-anchor="start" fill="#1f2937">план и карточка сетапа;</text>
<text x="24.0" y="632.0" font-size="12" text-anchor="start" fill="#1f2937">бэктест от 100 сделок, E &gt; 0</text>
<text x="282.0" y="498.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="600">5. Сто сделок на демо</text>
<text x="282.0" y="517.0" font-size="12" text-anchor="start" fill="#6b7280">месяцы 5–10 · уровень профи 09</text>
<text x="282.0" y="555.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="600">Условие:</text>
<text x="282.0" y="571.0" font-size="12" text-anchor="start" fill="#1f2937">тесты 01–05 на 80%+;</text>
<text x="282.0" y="586.0" font-size="12" text-anchor="start" fill="#1f2937">100 сделок по плану;</text>
<text x="282.0" y="601.0" font-size="12" text-anchor="start" fill="#1f2937">95% по правилам;</text>
<text x="282.0" y="616.0" font-size="12" text-anchor="start" fill="#1f2937">итог 2 месяцев &gt; 0;</text>
<text x="282.0" y="631.0" font-size="12" text-anchor="start" fill="#1f2937">нет нарушений дневного</text>
<text x="282.0" y="646.0" font-size="12" text-anchor="start" fill="#1f2937">лимита за месяц</text>
<text x="540.0" y="498.0" font-size="14" text-anchor="start" fill="#1f2937" font-weight="600">6. Первый реальный счёт</text>
<text x="540.0" y="517.0" font-size="12" text-anchor="start" fill="#6b7280">месяцы 11–12</text>
<text x="540.0" y="533.0" font-size="12" text-anchor="start" fill="#6b7280">риск 0,5–1%, без плеча</text>
<text x="540.0" y="571.0" font-size="12" text-anchor="start" fill="#1f2937" font-weight="600">Условие роста:</text>
<text x="540.0" y="587.0" font-size="12" text-anchor="start" fill="#1f2937">100 сделок по тем же</text>
<text x="540.0" y="602.0" font-size="12" text-anchor="start" fill="#1f2937">критериям → капитал ×1,5</text>
<text x="509.0" y="706.0" font-size="12" text-anchor="middle" fill="#b91c1c">правила нарушаются — назад на демо</text>
</svg>
