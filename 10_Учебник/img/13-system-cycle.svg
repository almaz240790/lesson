<text x="14.0" y="29.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">Правило становится системой после трёх проверок и может вернуться в начало с любой</text>
<text x="14.0" y="50.0" font-size="12" text-anchor="start" fill="#6b7280">Каждый этап заканчивается разбором по журналу; дальше проходит только то, что выдержало проверку</text>
<text x="81.0" y="96.0" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="700">Гипотеза</text>
<text x="81.0" y="118.0" font-size="11.5" text-anchor="middle" fill="#6b7280">правила «да/нет»</text>
<text x="81.0" y="135.0" font-size="11.5" text-anchor="middle" fill="#6b7280">записаны в план</text>
<text x="230.5" y="96.0" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="700">Бэктест</text>
<text x="230.5" y="118.0" font-size="11.5" text-anchor="middle" fill="#6b7280">100 сделок,</text>
<text x="230.5" y="135.0" font-size="11.5" text-anchor="middle" fill="#6b7280">отложенный отрезок</text>
<text x="230.5" y="152.0" font-size="11.5" text-anchor="middle" fill="#6b7280">смотрят один раз</text>
<text x="380.0" y="96.0" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="700">Демосчёт</text>
<text x="380.0" y="118.0" font-size="11.5" text-anchor="middle" fill="#6b7280">100 сделок по плану,</text>
<text x="380.0" y="135.0" font-size="11.5" text-anchor="middle" fill="#6b7280">правила в 95%</text>
<text x="380.0" y="152.0" font-size="11.5" text-anchor="middle" fill="#6b7280">сделок</text>
<text x="529.5" y="96.0" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="700">Реальный счёт</text>
<text x="529.5" y="118.0" font-size="11.5" text-anchor="middle" fill="#6b7280">малый, риск 0,5–1%</text>
<text x="529.5" y="135.0" font-size="11.5" text-anchor="middle" fill="#6b7280">на сделку, без плеча</text>
<text x="679.0" y="96.0" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="700">Система</text>
<text x="679.0" y="118.0" font-size="11.5" text-anchor="middle" fill="#6b7280">работает, пока</text>
<text x="679.0" y="135.0" font-size="11.5" text-anchor="middle" fill="#6b7280">метрики в норме</text>
<text x="380.0" y="256.0" font-size="13" text-anchor="middle" fill="#b91c1c" font-weight="600">Не выдержало проверку: вернуться к гипотезе и изменить одно правило</text>
<text x="16.0" y="290.0" font-size="12.5" text-anchor="start" fill="#6b7280">Большинство гипотез отсеивается на первом этапе: убыток на отложенном отрезке — обычный результат.</text>
</svg>
