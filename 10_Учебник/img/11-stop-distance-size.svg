<text x="380.0" y="406.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="700">Размер позиции = Риск $ / Расстояние до стопа</text>
<text x="380.0" y="427.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="600">10 / 0,02 = 500 $;      10 / 0,04 = 250 $</text>
