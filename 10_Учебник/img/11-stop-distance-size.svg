<text x="14.0" y="29.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">Стоп вдвое дальше — позиция вдвое меньше, убыток в долларах тот же</text>
<text x="14.0" y="50.0" font-size="12" text-anchor="start" fill="#6b7280">Депозит 1 000 $, риск 1% = 10 $, лонг от 60 000</text>
