<text x="14.0" y="29.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">Три графика, три вопроса: зоны и направление, сетап, точка входа</text>
<text x="14.0" y="50.0" font-size="12" text-anchor="start" fill="#6b7280">Учебная связка: 1D, 4H, 1H. Сверху вниз, по одному разу на каждом графике</text>
<text x="74.0" y="110.0" font-size="26" text-anchor="middle" fill="#2563eb" font-weight="700">1D</text>
<text x="74.0" y="134.0" font-size="13" text-anchor="middle" fill="#1f2937">Старший</text>
<text x="295.0" y="116.9" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="600">Куда идёт рынок и где зоны?</text>
<text x="608.0" y="107.4" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="600">Направление и две зоны:</text>
<text x="608.0" y="126.4" font-size="12.5" text-anchor="middle" fill="#6b7280">поддержка снизу, сопротивление сверху</text>
<text x="456.0" y="65.0" font-size="1" text-anchor="start" fill="#1f2937"></text>
<text x="86.0" y="171.0" font-size="12" text-anchor="start" fill="#6b7280">в 4–6 раз мельче</text>
<text x="74.0" y="218.0" font-size="26" text-anchor="middle" fill="#15803d" font-weight="700">4H</text>
<text x="74.0" y="242.0" font-size="13" text-anchor="middle" fill="#1f2937">Рабочий</text>
<text x="295.0" y="224.9" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="600">Есть ли у зоны сетап?</text>
<text x="608.0" y="215.4" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="600">Вход, стоп и цель</text>
<text x="608.0" y="234.4" font-size="12.5" text-anchor="middle" fill="#6b7280">либо запись «сделки нет»</text>
<text x="456.0" y="173.0" font-size="1" text-anchor="start" fill="#1f2937"></text>
<text x="86.0" y="279.0" font-size="12" text-anchor="start" fill="#6b7280">в 4–6 раз мельче</text>
<text x="74.0" y="326.0" font-size="26" text-anchor="middle" fill="#b45309" font-weight="700">1H</text>
<text x="74.0" y="350.0" font-size="13" text-anchor="middle" fill="#1f2937">Младший</text>
<text x="295.0" y="332.9" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="600">Можно ли войти ближе к стопу?</text>
<text x="608.0" y="323.4" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="600">Точная цена входа</text>
<text x="608.0" y="342.4" font-size="12.5" text-anchor="middle" fill="#6b7280">шаг необязателен, стоп не меняется</text>
<text x="456.0" y="281.0" font-size="1" text-anchor="start" fill="#1f2937"></text>
</svg>
