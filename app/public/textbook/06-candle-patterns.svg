<text x="14.0" y="29.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="600">У каждого свечного паттерна есть критерий, который считается по четырём ценам</text>
<text x="14.0" y="50.0" font-size="12" text-anchor="start" fill="#6b7280">Бычьи формы; медвежьи зеркальны. Зелёная свеча — закрытие выше открытия, красная — ниже</text>
<text x="129.0" y="92.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="700">Пин-бар</text>
<text x="129.0" y="248.0" font-size="11" text-anchor="middle" fill="#6b7280">Нижняя тень ≥ 2/3 диапазона</text>
<text x="160.0" y="148.0" font-size="11" text-anchor="start" fill="#6b7280">Диапазон</text>
<text x="56.0" y="181.0" font-size="11" text-anchor="end" fill="#2563eb" font-weight="600">Тень</text>
<text x="56.0" y="195.0" font-size="11" text-anchor="end" fill="#2563eb" font-weight="600">78%</text>
<text x="380.0" y="92.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="700">Поглощение</text>
<text x="380.0" y="248.0" font-size="11" text-anchor="middle" fill="#6b7280">Закрытие выше открытия красной</text>
<text x="448.0" y="154.0" font-size="11" text-anchor="start" fill="#2563eb">открытие 1-й</text>
<text x="448.0" y="134.0" font-size="11" text-anchor="start" fill="#2563eb" font-weight="600">закрытие 2-й</text>
<text x="324.0" y="210.0" font-size="12" text-anchor="middle" fill="#6b7280">1</text>
<text x="410.0" y="210.0" font-size="12" text-anchor="middle" fill="#6b7280">2</text>
<text x="631.0" y="92.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="700">Внутренний бар</text>
<text x="631.0" y="248.0" font-size="11" text-anchor="middle" fill="#6b7280">Диапазон внутри материнской свечи</text>
<text x="582.0" y="234.0" font-size="11" text-anchor="middle" fill="#6b7280">материнская</text>
<text x="658.0" y="234.0" font-size="11" text-anchor="middle" fill="#6b7280">внутренний</text>
<text x="129.0" y="296.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="700">Утренняя звезда</text>
<text x="129.0" y="452.0" font-size="11" text-anchor="middle" fill="#6b7280">Тела: 1-я ≥ 0,5 ATR, 2-я ≤ 1/3 первой</text>
<text x="158.0" y="347.0" font-size="11" text-anchor="end" fill="#2563eb">середина 1-й</text>
<text x="380.0" y="296.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="700">Доджи</text>
<text x="380.0" y="452.0" font-size="11" text-anchor="middle" fill="#6b7280">Тело ≤ 10% диапазона</text>
<text x="395.0" y="368.0" font-size="11" text-anchor="start" fill="#2563eb" font-weight="600">тело ≤ 10%</text>
<text x="395.0" y="382.0" font-size="11" text-anchor="start" fill="#2563eb">диапазона</text>
<text x="631.0" y="296.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="700">Вечерняя звезда</text>
<text x="631.0" y="452.0" font-size="11" text-anchor="middle" fill="#6b7280">Длинная зелёная, малое тело, красная</text>
